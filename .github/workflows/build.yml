name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 创建 Release 需要写权限（新仓库默认只读，不加会 403）
permissions:
  contents: write

env:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip zip
          java -version
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      # 不要用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而新版 cmdline-tools 已经没有 `tools` 包了，会直接 exit 1（实测踩到）。
      # ubuntu-22.04 runner 镜像自带 Android SDK，直接用，缺什么补什么。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK 目录：$SDK"
          ls "$SDK" || true
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(ls "$SDK"/tools/bin/sdkmanager 2>/dev/null | head -1 || true)
          fi
          echo "sdkmanager：$SDKM"
          if [ -n "$SDKM" ]; then
            if [ ! -d "$SDK/platforms/android-34" ]; then
              yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
              "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
            fi
          fi
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          test -f "$SDK/platforms/android-34/android.jar" && echo "✓ android-34 就绪" || echo "警告：没有 android-34"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      # 注意：日志重定向到文件（不要用管道），否则日志和退出码都不可靠
      - name: 编译 debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug > build.log 2>&1
          echo "退出码: $?"
          tail -25 build.log

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "======== 错误摘要 ========"
          grep -nE "^(e: |error:)|FAILURE:|Execution failed|What went wrong|Caused by|> Task .*FAILED|BUILD FAILED" build.log | head -60 || true
          echo "======== 尾部日志 ========"
          tail -80 build.log || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 判定 APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "没有生成 APK"; echo "found=0" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ball-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布到 Release（方便手机直接下载）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" /tmp/dsh-ball-browser.apk
          NOTES="自动云编译产物 · commit ${{ github.sha }} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh release create latest --title "最新构建" --notes "$NOTES" /tmp/dsh-ball-browser.apk 2>/dev/null \
            || gh release upload latest /tmp/dsh-ball-browser.apk --clobber
